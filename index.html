<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Vos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 40px;
            text-align: center;
            animation: fadeIn 2s ease-in-out;
            text-shadow: 0 0 10px #ffd700;
        }

        .flower-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: scaleUp 1.5s ease-out forwards;
        }

        .flower {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: #4a2c00;
            border-radius: 50%;
            z-index: 10;
            box-shadow: inset 0 0 10px #000;
        }

        .petals {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: spin 20s linear infinite;
        }

        .petal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 26px;
            height: 90px;
            background: #ffd700;
            border-radius: 50% 50% 0 0;
            transform-origin: bottom center;
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        /* Rotaciones circulares exactas fijadas */
        .petal:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
        .petal:nth-child(2) { transform: translate(-50%, -100%) rotate(30deg); }
        .petal:nth-child(3) { transform: translate(-50%, -100%) rotate(60deg); }
        .petal:nth-child(4) { transform: translate(-50%, -100%) rotate(90deg); }
        .petal:nth-child(5) { transform: translate(-50%, -100%) rotate(120deg); }
        .petal:nth-child(6) { transform: translate(-50%, -100%) rotate(150deg); }
        .petal:nth-child(7) { transform: translate(-50%, -100%) rotate(180deg); }
        .petal:nth-child(8) { transform: translate(-50%, -100%) rotate(210deg); }
        .petal:nth-child(9) { transform: translate(-50%, -100%) rotate(240deg); }
        .petal:nth-child(10) { transform: translate(-50%, -100%) rotate(270deg); }
        .petal:nth-child(11) { transform: translate(-50%, -100%) rotate(300deg); }
        .petal:nth-child(12) { transform: translate(-50%, -100%) rotate(330deg); }

        .stem {
            width: 8px;
            height: 150px;
            background: #2e7d32;
            border-radius: 0 0 4px 4px;
            animation: growStem 2s ease-out forwards;
            transform-origin: top center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleUp {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes growStem {
            from { transform: scaleY(0); }
            to { transform: scaleY(1); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <h1>¡Feliz 21 de Septiembre! 💛</h1>
    
    <div class="flower-container">
        <div class="flower">
            <div class="center"></div>
            <div class="petals">
                <div class="petal"></div> <div class="petal"></div>
                <div class="petal"></div> <div class="petal"></div>
                <div class="petal"></div> <div class="petal"></div>
                <div class="petal"></div> <div class="petal"></div>
                <div class="petal"></div> <div class="petal"></div>
                <div class="petal"></div> <div class="petal"></div>
            </div>
        </div>
        <div class="stem"></div>
    </div>

</body>
</html>
